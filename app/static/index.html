<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Okosfal dashboard</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, Arial, sans-serif; background:#0b0d10; color:#f3f5f7; }
    .wrap { min-height:100vh; padding:22px; display:grid; grid-template-rows:auto 1fr; gap:18px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:20px; }
    .date { font-size:clamp(20px,2vw,34px); font-weight:700; }
    .time { font-size:clamp(30px,4vw,58px); font-weight:800; letter-spacing:-1px; }
    .grid { display:grid; grid-template-columns:1.35fr .85fr; grid-template-rows:minmax(300px,1fr) minmax(240px,.85fr); gap:18px; }
    .card { background:#151920; border:1px solid #272d36; border-radius:20px; padding:20px; overflow:hidden; }
    h2 { margin:0 0 16px; font-size:22px; }
    #calendar { grid-row:1 / 3; }
    .event { display:grid; grid-template-columns:95px 1fr; gap:14px; padding:12px 0; border-bottom:1px solid #272d36; }
    .event:last-child { border-bottom:0; }
    .event-time { color:#9ba7b4; font-weight:700; }
    .event-title { font-size:18px; }
    .weather-big { font-size:52px; font-weight:800; }
    .muted { color:#9ba7b4; }
    .clothes { margin-top:14px; font-size:18px; line-height:1.5; }
    .trello-lists { display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; }
    .list { min-width:210px; flex:1; background:#0f1217; border-radius:14px; padding:12px; }
    .list h3 { margin:0 0 10px; font-size:15px; color:#a9b4c0; }
    .tcard { background:#1e242d; margin:8px 0; padding:10px 12px; border-radius:10px; }
    .error { color:#ffb4b4; }
    @media (max-width:900px) { .grid { grid-template-columns:1fr; grid-template-rows:auto; } #calendar { grid-row:auto; } }
  </style>
</head>
<body>
<div class="wrap">
  <header><div class="date" id="date"></div><div class="time" id="time"></div></header>
  <main class="grid">
    <section class="card" id="calendar"><h2>📅 Következő 7 nap</h2><div id="events">Betöltés…</div></section>
    <section class="card"><h2>🌤 Időjárás és ruha</h2><div id="weather">Betöltés…</div></section>
    <section class="card"><h2>📌 Trello</h2><div class="trello-lists" id="trello">Betöltés…</div></section>
  </main>
</div>
<script>
const fmtDay = new Intl.DateTimeFormat('hu-HU',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
function tick(){ const d=new Date(); date.textContent=fmtDay.format(d); time.textContent=d.toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'}); }
tick(); setInterval(tick,1000);
async function json(url){ const r=await fetch(url); if(!r.ok) throw new Error(`${r.status} ${r.statusText}`); return r.json(); }
async function loadCalendar(){ try { const data=await json('/api/calendar'); events.innerHTML=data.map(e=>{const d=new Date(e.start);return `<div class="event"><div class="event-time">${d.toLocaleDateString('hu-HU',{weekday:'short'})}<br>${d.toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'})}</div><div class="event-title">${escapeHtml(e.title)}</div></div>`}).join('') || '<div class="muted">Nincs esemény.</div>'; } catch(e){ events.innerHTML=`<div class="error">${e}</div>`; } }
async function loadWeather(){ try { const w=await json('/api/weather'); weather.innerHTML=`<div class="weather-big">${Math.round(w.current.temperature)} °C</div><div class="muted">Hőérzet ${Math.round(w.current.feels_like)} °C · Ma ${Math.round(w.today.min)}–${Math.round(w.today.max)} °C · Eső ${w.today.rain_probability}%</div><div class="clothes">👕 ${w.clothing.map(escapeHtml).join(' · ')}</div>`; } catch(e){ weather.innerHTML=`<div class="error">${e}</div>`; } }
async function loadTrello(){ try { const data=await json('/api/trello'); trello.innerHTML=data.map(l=>`<div class="list"><h3>${escapeHtml(l.name)}</h3>${l.cards.map(c=>`<div class="tcard">${escapeHtml(c)}</div>`).join('')}</div>`).join(''); } catch(e){ trello.innerHTML=`<div class="error">${e}</div>`; } }
function escapeHtml(s){ return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
loadCalendar(); loadWeather(); loadTrello(); setInterval(()=>{loadCalendar();loadWeather();loadTrello();},5*60*1000);
</script>
</body>
</html>
